## Endpoints
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 10

## Server Information
sv_hostname "Qbox RP Server | Powered by Overextended & Qbox"
sets sv_projectName "[Qbox RP] High Performance Roleplay"
sets sv_projectDesc "Full Qbox ecosystem with complete economy, jobs, and criminal systems."
sets tags "qbox, roleplay, rp, ox, jobs, police, ems, robberies, drugs"
sets locale "en-US"
load_server_icon myLogo.png
set steam_webApiKey "none"

## Core Engine & Convars
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
set sv_enforceGameBuild 3095
# Database connection string moved to secrets.cfg
set mysql_slow_query_warning 200

## License Key
## Secrets Configuration
exec secrets.cfg

## Chat config
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

## Voice config
exec voice.cfg

## Qbox config
setr qb_locale "en"
setr qbx:enableBridge "true" # enables qb-core bridge for legacy scripts
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qbox"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

## MOTD
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'>Welcome to <b>Qbox Roleplay</b>!</p>"

## illenium-appearance config
setr illenium-appearance:locale "en"

## Weather sync
setr weather_disablecd true

## Ox configs
exec ox.cfg

## NPWD config
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

## Loading screen
setr loadscreen:externalShutdown true
setr loadscreen:primaryColor "#f1e542"
setr loadscreen:shadowColor "#1a18077f"

## Default Base Resources
ensure mapmanager
ensure chat
ensure spawnmanager
# sessionmanager is built into modern FXServer
stop basic-gamemode
# hardcap is built into modern FXServer
ensure baseevents
ensure [cfx-default]

## Core Dependencies (Order is strictly validated)
# sv_identity owns character-selection presentation; qbx_core remains the backend.
setr sv_identity:replaceQboxCharacterSelector "true"
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [standalone]
ensure [voice]
ensure [assets]
ensure [eup]
ensure [qbx]
ensure sv_identity
ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

## Permissions & Miscellaneous
exec permissions.cfg
exec misc.cfg
