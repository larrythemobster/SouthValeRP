<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SouthVale MDT</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app" class="hidden"><div id="mdt">
<header><div class="brand">SOUTHVALE <b>MDT</b><small>LAW ENFORCEMENT RECORDS</small></div><nav id="nav">
<button data-view="home" class="active">Home</button><button data-view="citizens">Citizens</button><button data-view="vehicles">Vehicles</button><button data-view="incidents">Reports</button><button data-view="warrants">Warrants</button><button data-view="bolos">BOLOs</button><button data-view="processing">Processing</button></nav><button id="close" aria-label="Close">×</button></header>
<main>
<section id="view-home" class="view active"><div id="officer-card" class="officer-card"></div><div id="alerts" class="alert-list"></div><div class="grid three"><article><h2>Active officers</h2><div id="active-officers"></div></article><article><h2>Recent reports</h2><div id="recent-incidents"></div></article><article><h2>Currently jailed</h2><div id="prisoners"></div></article></div></section>
<section id="view-citizens" class="view"><div class="toolbar"><input id="citizen-query" placeholder="Name, citizen ID, or phone"><button id="citizen-search">Search</button></div><div id="citizen-results" class="results"></div><div id="citizen-profile" class="detail"></div></section>
<section id="view-vehicles" class="view"><div class="toolbar"><input id="vehicle-query" placeholder="Plate, owner, or model"><button id="vehicle-search">Search</button></div><div id="vehicle-results" class="results"></div></section>
<section id="view-incidents" class="view"><div class="split"><form id="incident-form" class="panel form"><h2>New report</h2><input name="title" maxlength="150" required placeholder="Report title"><textarea name="details" maxlength="5000" required placeholder="Narrative"></textarea><input name="citizens" placeholder="Involved citizen IDs, comma separated"><input name="evidence" maxlength="5000" placeholder="Evidence references, comma separated"><button>Save report</button></form><div class="panel"><h2>Reports</h2><div id="incident-list"></div></div></div></section>
<section id="view-warrants" class="view"><div class="split"><form id="warrant-form" class="panel form"><h2>Issue warrant</h2><select name="type"><option value="arrest">Arrest warrant</option><option value="search">Search warrant</option></select><input name="citizenid" required placeholder="Subject citizen ID"><input name="reason" required maxlength="500" placeholder="Reason"><textarea name="notes" placeholder="Supporting notes"></textarea><input name="incidentId" type="number" min="1" placeholder="Related report ID"><input name="expiresAt" type="datetime-local"><button>Issue warrant</button></form><div class="panel"><h2>Active warrants</h2><div id="warrant-list"></div></div></div></section>
<section id="view-bolos" class="view"><div class="split"><form id="bolo-form" class="panel form"><h2>Create BOLO</h2><select name="subjectType" id="bolo-type"><option value="person">Person</option><option value="vehicle">Vehicle</option></select><input name="title" required maxlength="150" placeholder="BOLO title"><input name="citizenid" placeholder="Subject citizen ID"><input name="plate" placeholder="Vehicle plate"><input name="reason" required maxlength="500" placeholder="Reason"><textarea name="description" required placeholder="Description"></textarea><input name="incidentId" type="number" min="1" placeholder="Related report ID"><input name="expiresAt" type="datetime-local"><button>Create BOLO</button></form><div class="panel"><h2>Active BOLOs</h2><div id="bolo-list"></div></div></div></section>
<section id="view-processing" class="view"><div class="split"><form id="citation-form" class="panel form process"><h2>Citation</h2><input name="citizenid" required placeholder="Citizen ID"><select name="charges" multiple required></select><input name="incidentId" type="number" min="1" placeholder="Related report ID"><textarea name="notes" placeholder="Notes"></textarea><p class="total">Calculated fine <strong>$<span>0</span></strong></p><button>Issue citation</button></form><form id="arrest-form" class="panel form process"><h2>Arrest booking</h2><input name="citizenid" required placeholder="Citizen ID"><select name="charges" multiple required></select><input name="incidentId" type="number" min="1" placeholder="Related report ID"><textarea name="notes" placeholder="Notes"></textarea><p class="total">Fine <strong>$<span>0</span></strong> · Jail <strong><span class="jail">0</span> min</strong></p><button>Book arrest</button></form></div></section>
</main><div id="toast"></div></div></div><script src="app.js"></script></body></html>
